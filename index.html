@keyframes mqShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes mqFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes mqGlow{0%,100%{text-shadow:0 0 12px #F5FF0F66}50%{text-shadow:0 0 28px #F5FF0Faa}}

@keyframes mqSlideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes mqSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.opt.correct{background:rgba(141,198,63,.2);border-color:#8dc63f;animation:mqPulse .5s}

/* ── CONFETTI ── */
function Confetti({active}){
  const ref=useRef(null),raf=useRef(null);
  useEffect(()=>{
    if(!active||!ref.current)return;
    const c=ref.current,ctx=c.getContext('2d');
    c.width=c.offsetWidth;c.height=c.offsetHeight;
    const cols=['#8dc63f','#F5FF0F','#0090C1','#f15f29','#fff','#FFD700'];
    const ps=Array.from({length:80},()=>({x:Math.random()*c.width,y:-20-Math.random()*180,w:4+Math.random()*6,h:6+Math.random()*10,col:cols[Math.floor(Math.random()*cols.length)],spd:2+Math.random()*3,ang:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.2,drift:(Math.random()-.5)*1.4}));
    const loop=()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.spd;p.x+=p.drift;p.ang+=p.spin;if(p.y>c.height+20){p.y=-20;p.x=Math.random()*c.width}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});raf.current=requestAnimationFrame(loop)};
    loop();return()=>cancelAnimationFrame(raf.current);
  },[active]);
  if(!active)return null;
  return <canvas ref={ref} style={{position:'fixed',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:9999}}/>;
}

/* ── CENTISECOND TIMER ── */
function CircTimer({centis, total=3000}){
  const R=38,C=2*Math.PI*R;
  const pct=centis/total;
  const secs=centis/100;
  const col=secs>20?'#8dc63f':secs>10?'#F5FF0F':'#f15f29';
  const display=secs.toFixed(2);
  return(
    <div style={{position:'relative',width:90,height:90}}>
      <svg width="90" height="90" style={{transform:'rotate(-90deg)'}}>
        <circle cx="45" cy="45" r={R} fill="none" stroke="rgba(255,255,255,.1)" strokeWidth="6"/>
        <circle cx="45" cy="45" r={R} fill="none" stroke={col} strokeWidth="6" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C*(1-pct)} style={{transition:'stroke .5s'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <span style={{color:col,fontSize:15,fontWeight:900,lineHeight:1,letterSpacing:'-0.5px',transition:'color .5s',fontVariantNumeric:'tabular-nums'}}>{display}</span>
        <span style={{color:'rgba(255,255,255,.38)',fontSize:8,fontWeight:700,letterSpacing:1}}>SEG</span>
      </div>
    </div>
  );
}

/* ══ MICRO-FEEDBACK ══ */
function MicroFeedback({session,date,onDone}){
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const [saving,setSaving]=useState(false);

  const questions=[
    {key:'liked_quiz',label:'Você gostou do quiz de hoje?',opts:[{v:true,l:'👍 Sim'},{v:false,l:'👎 Não'}],type:'bool'},
    {key:'difficulty',label:'O quiz de hoje foi...',opts:[{v:'facil',l:'😊 Fácil'},{v:'medio',l:'😐 Médio'},{v:'dificil',l:'😅 Difícil'}],type:'str'},
    {key:'will_return',label:'Você pretende voltar amanhã?',opts:[{v:true,l:'🔥 Sim!'},{v:false,l:'🤔 Talvez'}],type:'bool'},
    {key:'motivation',label:'O que mais te motivou hoje?',opts:[{v:'aprender',l:'🧠 Aprender'},{v:'competir',l:'🏆 Competir'},{v:'habito',l:'🔁 Hábito'},{v:'outro',l:'✨ Outro'}],type:'str'},
    {key:'video_useful',label:'O vídeo relacionado foi útil?',opts:[{v:true,l:'✅ Sim'},{v:false,l:'❌ Não vi'},{v:null,l:'⏭️ Pulei'}],type:'bool'},
  ];

  const q=questions[step];

  const pick=async(val)=>{
    const newAnswers={...answers,[q.key]:val};
    setAnswers(newAnswers);
    window.track('feedback_answer',{question:q.key,value:String(val)});
    if(step<questions.length-1){
      setStep(step+1);
    }else{
      setSaving(true);
      try{
        await sb.from('feedback_responses').upsert({
          user_id:session.user.id,
          date,
          liked_quiz:newAnswers.liked_quiz??null,
          difficulty:newAnswers.difficulty||null,
          will_return:newAnswers.will_return??null,
          motivation:newAnswers.motivation||null,
          video_useful:newAnswers.video_useful??null,
        });
      }catch(e){console.error(e);}finally{setSaving(false);onDone();}
    }
  };

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(180deg,#001c27,#003e52)',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px 20px'}}>
      <div style={{width:'100%',maxWidth:400,animation:'mqFadeUp .35s ease'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{display:'flex',justifyContent:'center',gap:6,marginBottom:20}}>
            {questions.map((_,i)=>(
              <div key={i} style={{width:i<=step?28:8,height:6,borderRadius:3,background:i<step?'#8dc63f':i===step?'#F5FF0F':'rgba(255,255,255,.18)',transition:'all .3s'}}/>
            ))}
          </div>
          <div style={{color:'rgba(255,255,255,.45)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>{step+1} de {questions.length}</div>
          <p style={{color:'#fff',fontSize:18,fontWeight:800,lineHeight:1.4}}>{q.label}</p>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {q.opts.map(o=>(
            <button key={String(o.v)} onClick={()=>pick(o.v)} disabled={saving} style={{
              background:'rgba(255,255,255,.08)',border:'2px solid rgba(255,255,255,.14)',
              borderRadius:16,padding:'16px 20px',
              color:'#fff',fontFamily:'Poppins',fontWeight:700,fontSize:15,
              cursor:'pointer',transition:'all .18s',textAlign:'center',
            }}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(141,198,63,.15)';e.currentTarget.style.borderColor='rgba(141,198,63,.5)'}}
            onMouseLeave={e=>{e.currentTarget.style.background='rgba(255,255,255,.08)';e.currentTarget.style.borderColor='rgba(255,255,255,.14)'}}>
              {o.l}
            </button>
          ))}
        </div>
        <button onClick={onDone} style={{background:'none',border:'none',color:'rgba(255,255,255,.28)',fontFamily:'Poppins',fontSize:12,cursor:'pointer',marginTop:20,width:'100%',padding:'8px',textAlign:'center'}}>
          Pular feedback →
        </button>
      </div>
    </div>
  );
}

/* ══ SCREEN: LOGIN ══ */
function LoginScreen({onLogin}){
  const [mode,setMode]=useState('login');
  const [name,setName]=useState('');
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [gender,setGender]=useState('');
  const [birthdate,setBirthdate]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');

  const submit=async()=>{
    setErr('');setLoading(true);
    try{
      if(mode==='register'){
        if(!name.trim()){setErr('Informe seu nome');setLoading(false);return;}
        if(!gender){setErr('Selecione seu gênero');setLoading(false);return;}
        if(!birthdate){setErr('Informe sua data de nascimento');setLoading(false);return;}
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{username:name.trim(),gender,birthdate}}});
        if(error)throw error;
        window.track('sign_up',{method:'email'});
        if(data.user)onLogin(data.user);
      }else{
        const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
        window.track('login',{method:'email'});
        if(data.user)onLogin(data.user);
      }
    }catch(e){
      const m=e.message||'Erro';
      if(m.includes('Invalid login'))setErr('Email ou senha incorretos');
      else if(m.includes('already registered'))setErr('Email já cadastrado');
      else if(m.includes('Password should'))setErr('Senha: mínimo 6 caracteres');
      else setErr(m);
    }finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(155deg,#003e52 0%,#002233 60%,#231f20 100%)',display:'flex',flexDirection:'column'}}>
      <BetaBanner/>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px 20px'}}>
        <div style={{width:'100%',maxWidth:400,animation:'mqFadeUp .4s ease'}}>
          <div style={{textAlign:'center',marginBottom:32}}>
            <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:68,height:68,borderRadius:20,background:'linear-gradient(135deg,#8dc63f,#0090C1)',marginBottom:12,boxShadow:'0 10px 32px rgba(141,198,63,.4)',animation:'mqFloat 3s ease-in-out infinite'}}>
              <IcZap s={32}/>
            </div>
            <div style={{fontSize:26,fontWeight:900,background:'linear-gradient(90deg,#8dc63f,#F5FF0F)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Momento QUIZ</div>
            <div style={{color:'rgba(255,255,255,.42)',fontSize:12,marginTop:5}}>Aprenda jogando. Evolua de verdade.</div>
          </div>

          <div style={{display:'flex',background:'rgba(255,255,255,.08)',borderRadius:14,padding:4,marginBottom:20}}>
            {['login','register'].map(m=>(
              <button key={m} onClick={()=>{setMode(m);setErr('')}} style={{flex:1,padding:'10px',border:'none',borderRadius:10,fontFamily:'Poppins',fontWeight:700,fontSize:13,cursor:'pointer',transition:'all .22s',background:mode===m?'#8dc63f':'transparent',color:mode===m?'#003e52':'rgba(255,255,255,.5)',boxShadow:mode===m?'0 3px 14px rgba(141,198,63,.3)':'none'}}>
                {m==='login'?'Entrar':'Criar Conta'}
              </button>
            ))}
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {mode==='register'&&(
              <>
                <div>
                  <label style={{color:'rgba(255,255,255,.45)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:6}}>Nome</label>
                  <input className="inp" placeholder="Seu nome" value={name} onChange={e=>setName(e.target.value)}/>
                </div>
                <div>
                  <label style={{color:'rgba(255,255,255,.45)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:6}}>Gênero</label>
                  <div style={{display:'flex',gap:8}}>
                    {[{v:'masculino',l:'Masculino',e:'👨'},{v:'feminino',l:'Feminino',e:'👩'},{v:'nao-binario',l:'Não-binário',e:'🧑'}].map(g=>(
                      <button key={g.v} type="button" onClick={()=>setGender(g.v)} style={{flex:1,padding:'10px 6px',border:`2px solid ${gender===g.v?'#8dc63f':'rgba(255,255,255,.12)'}`,borderRadius:12,background:gender===g.v?'rgba(141,198,63,.15)':'rgba(255,255,255,.06)',color:gender===g.v?'#8dc63f':'rgba(255,255,255,.6)',fontFamily:'Poppins',fontSize:10.5,fontWeight:700,cursor:'pointer',transition:'all .2s',display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                        <span style={{fontSize:18}}>{g.e}</span>{g.l}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label style={{color:'rgba(255,255,255,.45)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:6}}>Data de Nascimento</label>
                  <input className="inp" type="date" value={birthdate} onChange={e=>setBirthdate(e.target.value)} max={new Date().toISOString().split('T')[0]} style={{colorScheme:'dark'}}/>
                </div>
              </>
            )}
            <div>
              <label style={{color:'rgba(255,255,255,.45)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:6}}>Email</label>
              <input className="inp" type="email" placeholder="seu@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/>
            </div>
            <div>
              <label style={{color:'rgba(255,255,255,.45)',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:6}}>Senha</label>
              <input className="inp" type="password" placeholder="Mínimo 6 caracteres" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/>
            </div>
            {err&&<div style={{background:'rgba(241,95,41,.15)',border:'1px solid rgba(241,95,41,.35)',borderRadius:10,padding:'10px 14px',color:'#f15f29',fontSize:13,fontWeight:600}}>{err}</div>}
            <button className="btn-cta" onClick={submit} disabled={loading} style={{marginTop:4}}>
              {loading?<span className="spinner"/>:mode==='login'?<><IcZap s={17}/>Entrar</>:<>🎯 Criar Conta</>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══ SCREEN: DASHBOARD ══ */
function DashboardScreen({go,session,profile,dailyState}){
  const {answered,correct,loading:dLoading}=dailyState;
  const xpCur=profile?.total_score||0;
  const level=Math.floor(xpCur/500)+1;
  const xpNext=level*500,xpPrev=(level-1)*500;
  const xpPct=Math.min(100,Math.round(((xpCur-xpPrev)/500)*100));
  const name=profile?.username||session?.user?.user_metadata?.username||'Jogador';
  const [countdown,setCountdown]=useState('');

  useEffect(()=>{
    window.track('page_view',{page:'dashboard'});
    const tick=()=>{
      const sp=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
      const midnight=new Date(sp);midnight.setDate(midnight.getDate()+1);midnight.setHours(0,0,0,0);
      const diff=midnight-sp;
      const h=Math.floor(diff/3600000).toString().padStart(2,'0');
      const m=Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
      const s=Math.floor((diff%60000)/1000).toString().padStart(2,'0');
      setCountdown(`${h}:${m}:${s}`);
    };
    tick();const id=setInterval(tick,1000);return()=>clearInterval(id);
  },[]);

    window.track('quiz_start',{date:todayBrasilia()});

        </div>

            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:5}}><span className="pill">Nível {level}</span><span style={{color:'rgba(255,255,255,.35)',fontSize:11}}>Streak: {profile?.current_streak||0} dias 🔥</span></div>

/* ══ SCREEN: QUIZ ══ */
function QuizScreen({onFinish,session,dailyState}){
  const {question:q,loading:dLoading,slot=1}=dailyState;
  const [sel,setSel]=useState(null);
  const [centis,setCentis]=useState(3000); // 30.00 seconds in centiseconds
  const [showTip,setShowTip]=useState(false);
  const [popup,setPopup]=useState(null);
  const [saving,setSaving]=useState(false);
  const tid=useRef(null);
  const startRef=useRef(null);
  const answered=sel!==null;

  useEffect(()=>{
    if(!q||answered)return;
    window.track('quiz_question_shown',{question_id:q?.id});
    startRef.current=performance.now();
    tid.current=setInterval(()=>{
      const elapsed=performance.now()-startRef.current;
      const remaining=Math.max(0,3000-Math.round(elapsed/10));
      setCentis(remaining);
      if(remaining<=0){clearInterval(tid.current);doAnswer(null);}
    },50);
    return()=>clearInterval(tid.current);
  },[q,answered]);

  const doAnswer=async(id)=>{
    clearInterval(tid.current);
    const elapsed=performance.now()-startRef.current;
    const remainingCentis=Math.max(0,3000-Math.round(elapsed/10));
    const pts=parseFloat((remainingCentis/100).toFixed(2));
    const correct=id===q?.answer_letter;
    const finalPts=correct?pts:0;
    setSel(id);setShowTip(true);
    if(finalPts>0){setPopup(finalPts);setTimeout(()=>setPopup(null),1600);}
    window.track('quiz_answered',{correct,pts:finalPts,time_taken:30-pts});
    setSaving(true);
    try{
      const today=todayBrasilia();
      await sb.from('daily_answers').insert({
        user_id:session.user.id,
        date:today,
        question_id:q.id,
        chosen_letter:id,
        is_correct:correct,
        score:finalPts,
        slot,
      });
      const {data:prof}=await sb.from('profiles').select('total_score,quizzes_played').eq('id',session.user.id).single();
      if(prof){
        await sb.from('profiles').update({
          total_score:parseFloat(((prof.total_score||0)+finalPts).toFixed(2)),
          quizzes_played:(prof.quizzes_played||0)+1,
        }).eq('id',session.user.id);
      }
      setTimeout(()=>onFinish({correct,pts:finalPts,question:q}),120);
    }catch(e){console.error(e);setTimeout(()=>onFinish({correct,pts:finalPts,question:q}),120);}
    finally{setSaving(false);}
  };

  if(dLoading)return<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#002d3d',flexDirection:'column',gap:16}}><span className="spinner"/><span style={{color:'rgba(255,255,255,.5)',fontSize:13}}>Carregando...</span></div>;
  if(!q)return<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#002d3d',flexDirection:'column',gap:12,padding:24,textAlign:'center'}}><span style={{fontSize:36}}>😴</span><span style={{color:'rgba(255,255,255,.5)'}}>Sem pergunta para hoje.</span></div>;

  const opts=[{id:'a',txt:q.option_a},{id:'b',txt:q.option_b},{id:'c',txt:q.option_c},{id:'d',txt:q.option_d}].filter(o=>o.txt);

  return(
    <div style={{minHeight:'100%',background:'linear-gradient(180deg,#002d3d 0%,#003e52 100%)',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'16px 20px 8px',maxWidth:480,margin:'0 auto',width:'100%'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{color:'rgba(255,255,255,.5)',fontSize:12,fontWeight:700}}>🗓️ Pergunta de Hoje</span>
          <span className="pill">🏥 Saúde</span>
        </div>
      </div>

      <div style={{padding:'6px 20px 2px',display:'flex',justifyContent:'center',position:'relative',maxWidth:480,margin:'0 auto',width:'100%'}}>
        <CircTimer centis={centis}/>
        {popup&&(
          <div style={{position:'absolute',top:'50%',right:40,transform:'translateY(-50%)',color:'#F5FF0F',fontSize:18,fontWeight:900,animation:'mqScorePop 1.6s ease-out forwards',textShadow:'0 0 16px #F5FF0F88',pointerEvents:'none',fontVariantNumeric:'tabular-nums'}}>
            +{popup.toFixed(2)} pts!
          </div>
        )}
      </div>

      <div style={{padding:'10px 20px 10px',maxWidth:480,margin:'0 auto',width:'100%'}}>
        <p style={{color:'#fff',fontSize:15,fontWeight:700,lineHeight:1.55,animation:'mqFadeUp .3s ease'}}>
          {q.question?.replace(/[\u200c\u200b\u200d\u00ad]/g,'').trim()}
        </p>
      </div>

      <div style={{padding:'0 20px',flex:1,maxWidth:480,margin:'0 auto',width:'100%'}}>
        {opts.map(o=>{
          const isCorrect=o.id===q.answer_letter,isSel=o.id===sel;
          let cls='opt';
          if(answered){if(isCorrect)cls='opt correct';else if(isSel)cls='opt wrong';else cls='opt dim';}
          return(
            <button key={o.id} className={cls} disabled={answered||saving} onClick={()=>doAnswer(o.id)}>
              <span style={{width:30,height:30,borderRadius:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,background:answered?(isCorrect?'#8dc63f':(isSel?'#f15f29':'rgba(255,255,255,.07)')):'rgba(255,255,255,.13)',color:'#fff'}}>
                {answered&&isCorrect?<IcCheck s={14} c="#fff"/>:answered&&isSel?<IcX s={14} c="#fff"/>:o.id.toUpperCase()}
              </span>
              <span style={{color:answered&&!isCorrect&&!isSel?'rgba(255,255,255,.28)':'#fff',fontSize:13.5,lineHeight:1.3}}>
                {o.txt?.replace(/[\u200c\u200b\u200d\u00ad]/g,'').trim()}
              </span>
            </button>
          );
        })}
      </div>

      {showTip&&(
        <div style={{margin:'6px 20px',background:'linear-gradient(135deg,#001c27,#002a38)',borderRadius:16,padding:'14px 16px',border:'1px solid rgba(245,255,15,.2)',animation:'mqSlideUp .3s ease',maxWidth:480,alignSelf:'center',width:'calc(100% - 40px)'}}>
          <div style={{color:'#F5FF0F',fontSize:10,fontWeight:800,letterSpacing:.8,marginBottom:6}}>💡 SABIA QUE...</div>
          {q.justification
            ?<p style={{color:'rgba(255,255,255,.82)',fontSize:13,lineHeight:1.6}}>{q.justification}</p>
            :<p style={{color:'rgba(255,255,255,.5)',fontSize:13}}>A resposta correta é a letra <strong style={{color:'#8dc63f'}}>{q.answer_letter?.toUpperCase()}</strong>.</p>
          }
          <YTButton url={q.youtube_url} isCorrect={sel===q.answer_letter}/>
        </div>
      )}

      {answered&&(
        <div style={{padding:'8px 20px 18px',display:'flex',justifyContent:'flex-end',maxWidth:480,margin:'0 auto',width:'100%'}}>

/* ══ HISTORY DETAIL MODAL ══ */
function HistoryDetail({item, onClose}){
  if(!item)return null;
  const q=item.questions;
  const opts=[{id:'a',txt:q?.option_a},{id:'b',txt:q?.option_b},{id:'c',txt:q?.option_c},{id:'d',txt:q?.option_d}].filter(o=>o.txt);
  const chosen=item.chosen_letter;
  const correct=q?.answer_letter;
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',zIndex:9000,display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:'linear-gradient(180deg,#002d3d,#001c27)',borderRadius:'24px 24px 0 0',padding:'24px 20px 40px',width:'100%',maxWidth:480,maxHeight:'90vh',overflowY:'auto',animation:'mqSlideUp .3s ease'}} onClick={e=>e.stopPropagation()}>
        {/* Handle */}
        <div style={{width:40,height:4,borderRadius:2,background:'rgba(255,255,255,.2)',margin:'0 auto 20px'}}/>
        {/* Date + result */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <span style={{color:'rgba(255,255,255,.4)',fontSize:12}}>{new Date(item.answered_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}</span>
          <span style={{color:item.is_correct?'#8dc63f':'#f15f29',fontWeight:800,fontSize:13}}>{item.is_correct?`✅ +${parseFloat(item.score||0).toFixed(2)} pts`:'❌ Errou'}</span>
        </div>
        {/* Question */}
        <p style={{color:'#fff',fontSize:15,fontWeight:700,lineHeight:1.55,marginBottom:16}}>
          {q?.question?.replace(/[\u200c\u200b\u200d\u00ad]/g,'').trim()}
        </p>
        {/* Options */}
        {opts.map(o=>{
          const isCorrect=o.id===correct;
          const isChosen=o.id===chosen;
          let bg='rgba(255,255,255,.06)';
          let border='rgba(255,255,255,.1)';
          let col='rgba(255,255,255,.55)';
          if(isCorrect){bg='rgba(141,198,63,.18)';border='#8dc63f';col='#fff';}
          else if(isChosen&&!isCorrect){bg='rgba(241,95,41,.18)';border='#f15f29';col='#fff';}
          return(
            <div key={o.id} style={{display:'flex',alignItems:'center',gap:11,padding:'13px 14px',borderRadius:14,border:`2px solid ${border}`,background:bg,marginBottom:8}}>
              <span style={{width:28,height:28,borderRadius:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,background:isCorrect?'#8dc63f':(isChosen?'#f15f29':'rgba(255,255,255,.1)'),color:'#fff'}}>
                {isCorrect?<IcCheck s={13} c="#fff"/>:isChosen?<IcX s={13} c="#fff"/>:o.id.toUpperCase()}
              </span>
              <span style={{color:col,fontSize:13,lineHeight:1.3}}>{o.txt?.replace(/[\u200c\u200b\u200d\u00ad]/g,'').trim()}</span>
            </div>
          );
        })}
        {/* Justification */}
        {q?.justification&&(
          <div style={{marginTop:12,background:'rgba(245,255,15,.07)',border:'1px solid rgba(245,255,15,.18)',borderRadius:14,padding:'13px 14px'}}>
            <div style={{color:'#F5FF0F',fontSize:10,fontWeight:800,letterSpacing:.8,marginBottom:5}}>💡 SABIA QUE...</div>
            <p style={{color:'rgba(255,255,255,.78)',fontSize:13,lineHeight:1.55}}>{q.justification}</p>
          </div>
        )}
        <YTButton url={q?.youtube_url} isCorrect={item.is_correct}/>
        <button onClick={onClose} className="btn-ghost" style={{marginTop:16}}>Fechar</button>
      </div>
    </div>
  );
}

/* ══ SCREEN: RANKING ══ */
function RankingScreen({session}){
  const [rank,setRank]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  useEffect(()=>{
    window.track('page_view',{page:'ranking'});
    const load=async()=>{
      try{
        // Try ranking view first, fallback to profiles direct query
        const {data,error}=await sb.from('ranking').select('*').limit(50);
        if(!error&&data&&data.length>0){
          setRank(data);
        }else{
          const {data:fallback}=await sb.from('profiles')
            .select('id,username,avatar_emoji,total_score,quizzes_played')
            .gt('quizzes_played',0)
            .order('total_score',{ascending:false})
            .limit(50);
          setRank((fallback||[]).map((p,i)=>({...p,position:i+1})));
        }
      }catch(e){setErr('Erro ao carregar ranking.');}
      finally{setLoading(false);}
    };
    load();
  },[]);
  const myId=session?.user?.id;
  const podium=rank.slice(0,3),rest=rank.slice(3);
  const po=podium.length>=3?[podium[1],podium[0],podium[2]]:podium;
  const pH=[76,100,64],pC=['#C0C0C0','#FFD700','#CD7F32'],pL=['2º','1º','3º'];

  return(
    <div style={{minHeight:'100%',background:'linear-gradient(180deg,#004060 0%,#003e52 35%,#002233 100%)',paddingBottom:80}}>
      <BetaBanner/>
      <div style={{background:'linear-gradient(180deg,#004d65,transparent)',padding:'20px 20px 0',maxWidth:480,margin:'0 auto'}}>
        <div style={{color:'#fff',fontSize:22,fontWeight:900,marginBottom:20}}>🏆 Ranking Global</div>
        {loading?<div style={{textAlign:'center',padding:60}}><span className="spinner" style={{margin:'0 auto',display:'block'}}/></div>
        :err?<div className="card" style={{textAlign:'center',padding:'24px',color:'#f15f29'}}>{err}</div>
        :rank.length===0?<div className="card" style={{textAlign:'center',padding:'40px 20px',marginBottom:12}}><div style={{fontSize:36,marginBottom:12}}>🏆</div><div style={{color:'rgba(255,255,255,.5)',fontSize:14}}>Seja o primeiro a jogar!</div></div>
        :<>
          {/* Pódio — só mostra com 3+ usuários */}
          {podium.length>=3&&(
            <div style={{display:'flex',alignItems:'flex-end',justifyContent:'center',gap:6,marginBottom:12}}>
              {po.map((p,i)=>(
                <div key={p.id} style={{textAlign:'center',width:100}}>
                  <div style={{fontSize:i===1?28:20,marginBottom:i===1?0:4,animation:i===1?'mqFloat 2.5s ease-in-out infinite':'none'}}>{p.avatar_emoji||'😊'}</div>
                  {i===1&&<div style={{fontSize:16,marginBottom:2}}>👑</div>}
                  <div style={{color:'#fff',fontSize:10,fontWeight:700,marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.username}</div>
                  <div style={{height:pH[i],background:`linear-gradient(0deg,${pC[i]}33,${pC[i]}11)`,border:`2px solid ${pC[i]}`,borderRadius:'8px 8px 0 0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2}}>
                    <div style={{color:pC[i],fontWeight:900,fontSize:14}}>{pL[i]}</div>
                    <div style={{color:'#fff',fontSize:10}}>{parseFloat(p.total_score||0).toFixed(2)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {/* Lista completa (inclui top 3 se < 3 usuários) */}
          <div style={{paddingBottom:8}}>
            {(podium.length<3?rank:rest).map((p,i)=>{
              const isMe=p.id===myId;
              const pos=podium.length<3?i+1:p.position;
              return(
                <div key={p.id} className="card" style={{marginBottom:8,display:'flex',alignItems:'center',gap:12,border:isMe?'1.5px solid #8dc63f':'1px solid rgba(255,255,255,.08)',background:isMe?'rgba(141,198,63,.1)':'rgba(255,255,255,.05)'}}>
                  <span style={{color:'rgba(255,255,255,.36)',fontWeight:800,fontSize:11,width:22,textAlign:'center'}}>#{pos}</span>
                  <span style={{fontSize:20}}>{p.avatar_emoji||'😊'}</span>
                  <span style={{flex:1,color:isMe?'#8dc63f':'#fff',fontWeight:isMe?700:500,fontSize:13}}>{p.username}{isMe?' (Você)':''}</span>
                  <span style={{color:'#F5FF0F',fontWeight:900,fontSize:12,fontVariantNumeric:'tabular-nums'}}>{parseFloat(p.total_score||0).toFixed(2)}</span>
                </div>
              );
            })}
          </div>
        </>}
      </div>
    </div>
  );
}

      try{
        const [{data:st},{data:us},{data:fb},{data:cfg}]=await Promise.all([
          sb.from('admin_stats').select('*').single(),
          sb.from('profiles').select('*').order('total_score',{ascending:false}).limit(50),
          sb.from('feedback_responses').select('*').order('answered_at',{ascending:false}).limit(100),
          sb.from('app_settings').select('value').eq('key','daily_quiz_count').single(),
        ]);
        setStats(st);setUsers(us||[]);
        setQuizCount(parseInt(cfg?.value||'1',10));
        if(fb){
          const liked=fb.filter(f=>f.liked_quiz===true).length;
          const total=fb.filter(f=>f.liked_quiz!==null).length;
          const diff={facil:0,medio:0,dificil:0};
          fb.forEach(f=>{if(f.difficulty)diff[f.difficulty]=(diff[f.difficulty]||0)+1;});
          const mot={};
          fb.forEach(f=>{if(f.motivation)mot[f.motivation]=(mot[f.motivation]||0)+1;});
          setFeedbacks({total:fb.length,satisfaction:total?Math.round((liked/total)*100):null,difficulty:diff,motivation:mot,raw:fb});
        }
      }finally{setLoading(false);}
    };
    load();
  },[]);

  const saveQuizCount=async(val)=>{
    setSavingConfig(true);setConfigMsg('');
    try{
      await sb.from('app_settings').upsert({key:'daily_quiz_count',value:String(val),updated_at:new Date().toISOString()});
      setQuizCount(val);
      setConfigMsg('✅ Salvo com sucesso!');
    }catch(e){setConfigMsg('❌ Erro: '+e.message);}
    finally{setSavingConfig(false);setTimeout(()=>setConfigMsg(''),3000);}
  };

  const loadTestQ=async()=>{
    const {data}=await sb.from('questions').select('*').limit(322);
    if(data){const r=data[Math.floor(Math.random()*data.length)];setTestQ(r);setTestSel(null);}
  };
  const toggleAdmin=async(uid,cur)=>{
    await sb.from('profiles').update({is_admin:!cur}).eq('id',uid);
    setUsers(us=>us.map(u=>u.id===uid?{...u,is_admin:!cur}:u));
  };

  if(loading)return<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#002d3d'}}><span className="spinner"/></div>;

  const opts=testQ?[{id:'a',txt:testQ.option_a},{id:'b',txt:testQ.option_b},{id:'c',txt:testQ.option_c},{id:'d',txt:testQ.option_d}].filter(o=>o.txt):[];

  return(
    <div style={{minHeight:'100%',background:'linear-gradient(180deg,#001c27 0%,#002d3d 100%)',paddingBottom:80}}>
      <BetaBanner/>
      <div style={{padding:'20px 20px 16px',maxWidth:480,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
          <div style={{width:36,height:36,borderRadius:10,background:'rgba(241,95,41,.2)',border:'1px solid rgba(241,95,41,.4)',display:'flex',alignItems:'center',justifyContent:'center'}}><IcShield s={18} c="#f15f29"/></div>
          <div><div style={{color:'#f15f29',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:1}}>Área Restrita</div><h1 style={{fontSize:18,fontWeight:900}}>Painel Admin</h1></div>
        </div>
        <div style={{display:'flex',background:'rgba(255,255,255,.07)',borderRadius:12,padding:3,marginBottom:18,gap:3}}>
          {[{id:'stats',l:'📊 Stats'},{id:'feedback',l:'💬 Feedback'},{id:'config',l:'⚙️ Config'},{id:'test',l:'🎯 Testar'},{id:'users',l:'👥 Users'}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'8px 3px',border:'none',borderRadius:9,fontFamily:'Poppins',fontWeight:700,fontSize:10,cursor:'pointer',background:tab===t.id?'rgba(241,95,41,.25)':'transparent',color:tab===t.id?'#f15f29':'rgba(255,255,255,.45)'}}>
              {t.l}
            </button>
          ))}
        </div>

        {/* CONFIG */}
        {tab==='config'&&(
          <div style={{animation:'mqFadeUp .3s ease'}}>
            <div className="card" style={{marginBottom:16,background:'rgba(241,95,41,.07)',border:'1px solid rgba(241,95,41,.2)'}}>
              <div style={{color:'#f15f29',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:14}}>Quizzes por Dia</div>
              <p style={{color:'rgba(255,255,255,.55)',fontSize:12,lineHeight:1.5,marginBottom:18}}>
                Define quantas perguntas os usuários respondem por dia (1 a 5). A mudança vale imediatamente para quem ainda não respondeu hoje.
              </p>
              {/* Visual selector 1-5 */}
              <div style={{display:'flex',gap:8,marginBottom:18}}>
                {[1,2,3,4,5].map(n=>(
                  <button key={n} onClick={()=>setQuizCount(n)} style={{
                    flex:1,aspectRatio:'1',border:`2px solid ${quizCount===n?'#f15f29':'rgba(255,255,255,.15)'}`,
                    borderRadius:14,background:quizCount===n?'rgba(241,95,41,.25)':'rgba(255,255,255,.06)',
                    color:quizCount===n?'#f15f29':'rgba(255,255,255,.5)',
                    fontFamily:'Poppins',fontWeight:900,fontSize:22,cursor:'pointer',transition:'all .2s',
                    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,
                    padding:'12px 0',
                  }}>
                    {n}
                    <span style={{fontSize:9,fontWeight:600,color:quizCount===n?'rgba(241,95,41,.8)':'rgba(255,255,255,.3)'}}>
                      quiz{n>1?'zes':''}
                    </span>
                  </button>
                ))}
              </div>
              {/* Preview */}
              <div style={{background:'rgba(0,0,0,.25)',borderRadius:10,padding:'12px 14px',marginBottom:14}}>
                <div style={{color:'rgba(255,255,255,.4)',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Preview — barra de progresso</div>
                <div style={{display:'flex',gap:5}}>
                  {Array.from({length:quizCount},(_,i)=>(
                    <div key={i} style={{flex:1,height:6,borderRadius:3,background:i===0?'#8dc63f':'rgba(255,255,255,.15)'}}/>
                  ))}
                </div>
                <div style={{color:'rgba(255,255,255,.35)',fontSize:11,marginTop:8}}>
                  Usuário verá {quizCount} quiz{quizCount>1?'zes':''} por dia
                </div>
              </div>
              <button onClick={()=>saveQuizCount(quizCount)} disabled={savingConfig} className="btn-cta" style={{background:'linear-gradient(135deg,#f15f29,#c0392b)',fontSize:14}}>
                {savingConfig?<span className="spinner"/>:'💾 Salvar configuração'}
              </button>
              {configMsg&&<div style={{marginTop:10,color:configMsg.startsWith('✅')?'#8dc63f':'#f15f29',fontSize:12,fontWeight:600,textAlign:'center'}}>{configMsg}</div>}
            </div>

            <div className="card" style={{background:'rgba(0,144,193,.07)',border:'1px solid rgba(0,144,193,.2)'}}>
              <div style={{color:'#0090C1',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:8}}>Reset via SQL (para testes)</div>
              <div style={{background:'rgba(0,0,0,.3)',borderRadius:8,padding:'10px 12px',fontFamily:'monospace',fontSize:10,color:'#8dc63f',lineHeight:1.7,wordBreak:'break-all'}}>
                DELETE FROM daily_answers<br/>
                WHERE user_id = (<br/>
                &nbsp;&nbsp;SELECT id FROM auth.users<br/>
                &nbsp;&nbsp;WHERE email = 'SEU@EMAIL'<br/>
                ) AND date = (NOW() AT TIME ZONE<br/>
                &nbsp;&nbsp;'America/Sao_Paulo')::date;
              </div>
            </div>
          </div>
        )}

        {/* STATS */}
        {tab==='stats'&&stats&&(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
              {[
                {l:'Usuários',v:stats.total_users,e:'👥'},
                {l:'Responderam hoje',v:stats.answers_today,e:'📅'},
                {l:'Acertos hoje',v:stats.correct_today,e:'✅'},
                {l:'Responderam ontem',v:stats.answers_yesterday,e:'📆'},
                {l:'Total perguntas',v:stats.total_questions,e:'❓'},
                {l:'Feedbacks hoje',v:stats.feedbacks_today,e:'💬'},
                {l:'Respostas totais',v:stats.total_answers_all_time,e:'📊'},
                {l:'Satisfação geral',v:stats.satisfaction_pct!=null?`${stats.satisfaction_pct}%`:'–',e:'😊'},
              ].map((s,i)=>(
                <div key={i} className="card" style={{display:'flex',alignItems:'center',gap:10,background:'rgba(241,95,41,.07)',border:'1px solid rgba(241,95,41,.15)'}}>
                  <span style={{fontSize:18}}>{s.e}</span>
                  <div><div style={{color:'#fff',fontWeight:800,fontSize:17}}>{s.v}</div><div style={{color:'rgba(255,255,255,.36)',fontSize:9}}>{s.l}</div></div>
                </div>
              ))}
            </div>
            <div className="card" style={{background:'rgba(245,255,15,.06)',border:'1px solid rgba(245,255,15,.15)',textAlign:'center',padding:'14px'}}>
              <div style={{color:'#F5FF0F',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Hoje em Brasília</div>
              <div style={{color:'#fff',fontSize:15,fontWeight:700}}>{todayBrasilia()}</div>
            </div>
          </div>
        )}

        {/* FEEDBACK */}
        {tab==='feedback'&&(
          <div>
            {!feedbacks?<div className="card" style={{textAlign:'center',padding:24}}><div style={{color:'rgba(255,255,255,.4)'}}>Nenhum feedback ainda.</div></div>:(
              <>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                  <div className="card" style={{textAlign:'center',background:'rgba(141,198,63,.08)',border:'1px solid rgba(141,198,63,.2)'}}>
                    <div style={{fontSize:28,fontWeight:900,color:'#8dc63f'}}>{feedbacks.satisfaction!=null?`${feedbacks.satisfaction}%`:'–'}</div>
                    <div style={{color:'rgba(255,255,255,.4)',fontSize:10}}>Gostaram do quiz</div>
                  </div>
                  <div className="card" style={{textAlign:'center',background:'rgba(0,144,193,.08)',border:'1px solid rgba(0,144,193,.2)'}}>
                    <div style={{fontSize:28,fontWeight:900,color:'#0090C1'}}>{feedbacks.total}</div>
                    <div style={{color:'rgba(255,255,255,.4)',fontSize:10}}>Feedbacks totais</div>
                  </div>
                </div>
                <div className="card" style={{marginBottom:10}}>
                  <div style={{color:'rgba(255,255,255,.4)',fontSize:10,fontWeight:800,textTransform:'uppercase',marginBottom:10}}>Dificuldade percebida</div>
                  {Object.entries(feedbacks.difficulty).map(([k,v])=>(
                    <div key={k} style={{marginBottom:7}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                        <span style={{color:'#fff',fontSize:12,textTransform:'capitalize'}}>{k}</span>
                        <span style={{color:'#F5FF0F',fontSize:12,fontWeight:700}}>{v}</span>
                      </div>
                      <div className="progress-bar"><div className="progress-fill" style={{width:feedbacks.total?`${(v/feedbacks.total)*100}%`:'0%'}}/></div>
                    </div>
                  ))}
                </div>
                <div className="card">
                  <div style={{color:'rgba(255,255,255,.4)',fontSize:10,fontWeight:800,textTransform:'uppercase',marginBottom:10}}>O que motivou</div>
                  {Object.entries(feedbacks.motivation).map(([k,v])=>(
                    <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,.05)'}}>
                      <span style={{color:'#fff',fontSize:12,textTransform:'capitalize'}}>{k}</span>
                      <span style={{color:'#0090C1',fontSize:13,fontWeight:800}}>{v}×</span>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        )}

        {/* TEST */}
        {tab==='test'&&(
          <div>
            <button className="btn-cta" onClick={loadTestQ} style={{marginBottom:16,background:'linear-gradient(135deg,#f15f29,#c0392b)'}}>
              <IcRefresh s={16} c="#fff"/>Carregar pergunta aleatória
            </button>
            {testQ&&(
              <div>
                <div className="card" style={{marginBottom:12,background:'rgba(241,95,41,.07)',border:'1px solid rgba(241,95,41,.2)'}}>
                  <p style={{color:'#fff',fontSize:14,fontWeight:700,lineHeight:1.5}}>{testQ.question?.replace(/[\u200c\u200b\u200d\u00ad]/g,'').trim()}</p>
                </div>
                {opts.map(o=>{
                  const isCorrect=o.id===testQ.answer_letter,isSel=o.id===testSel;
                  let cls='opt';
                  if(testSel){if(isCorrect)cls='opt correct';else if(isSel)cls='opt wrong';else cls='opt dim';}
                  return(
                    <button key={o.id} className={cls} disabled={!!testSel} onClick={()=>setTestSel(o.id)}>
                      <span style={{width:28,height:28,borderRadius:7,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,background:testSel?(isCorrect?'#8dc63f':(isSel?'#f15f29':'rgba(255,255,255,.07)')):'rgba(255,255,255,.13)',color:'#fff'}}>
                        {testSel&&isCorrect?<IcCheck s={13} c="#fff"/>:testSel&&isSel?<IcX s={13} c="#fff"/>:o.id.toUpperCase()}
                      </span>
                      <span style={{fontSize:13}}>{o.txt?.replace(/[\u200c\u200b\u200d\u00ad]/g,'').trim()}</span>
                    </button>
                  );
                })}
                {testSel&&(
                  <div style={{background:'linear-gradient(135deg,#001c27,#002a38)',borderRadius:14,padding:'14px',border:'1px solid rgba(245,255,15,.2)',marginTop:4}}>
                    <div style={{color:'#F5FF0F',fontSize:10,fontWeight:800,marginBottom:6}}>💡 Justificativa</div>
                    {testQ.justification?<p style={{color:'rgba(255,255,255,.8)',fontSize:12.5,lineHeight:1.5}}>{testQ.justification}</p>:<p style={{color:'rgba(255,255,255,.4)',fontSize:12}}>Sem justificativa.</p>}
                    <YTButton url={testQ.youtube_url} isCorrect={testSel===testQ.answer_letter}/>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* USERS */}
        {tab==='users'&&(
          <div>
            <div className="card" style={{marginBottom:12,background:'rgba(0,144,193,.08)',border:'1px solid rgba(0,144,193,.2)'}}>
              <div style={{color:'#0090C1',fontSize:11,fontWeight:800,textTransform:'uppercase',marginBottom:8}}>Promover Admin via SQL</div>
              <div style={{background:'rgba(0,0,0,.3)',borderRadius:8,padding:'10px 12px',fontFamily:'monospace',fontSize:10.5,color:'#8dc63f',lineHeight:1.6,wordBreak:'break-all'}}>
                UPDATE profiles SET is_admin=true<br/>
                WHERE id=(<br/>
                &nbsp;SELECT id FROM auth.users<br/>
                &nbsp;WHERE email='EMAIL'<br/>
                );
              </div>
            </div>
            {users.map((u,i)=>(
              <div key={u.id} className="card" style={{marginBottom:8,display:'flex',alignItems:'center',gap:10}}>
                <span style={{color:'rgba(255,255,255,.3)',fontSize:11,fontWeight:700,width:18}}>#{i+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:'#fff',fontWeight:600,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.username||'–'}</div>
                  <div style={{color:'rgba(255,255,255,.35)',fontSize:10}}>{parseFloat(u.total_score||0).toFixed(2)} pts · {u.quizzes_played||0} respostas</div>
                </div>
                {u.is_admin&&<span style={{background:'rgba(241,95,41,.2)',border:'1px solid rgba(241,95,41,.4)',borderRadius:8,padding:'2px 8px',color:'#f15f29',fontSize:10,fontWeight:700}}>ADMIN</span>}
                <button onClick={()=>toggleAdmin(u.id,u.is_admin)} style={{background:'none',border:`1px solid ${u.is_admin?'rgba(241,95,41,.4)':'rgba(255,255,255,.15)'}`,borderRadius:8,padding:'5px 10px',color:u.is_admin?'#f15f29':'rgba(255,255,255,.4)',fontFamily:'Poppins',fontSize:10,fontWeight:700,cursor:'pointer',flexShrink:0}}>
                  {u.is_admin?'Remover':'+ Admin'}
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ APP ROOT ══ */
function App(){
  const [session,setSession]=useState(null);
  const [profile,setProfile]=useState(null);
  const [screen,setScreen]=useState(()=>localStorage.getItem('mq_scr')||'dashboard');
  const [authLoading,setAuthLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [tweaksVis,setTweaksVis]=useState(false);
  const [dailyResult,setDailyResult]=useState(null);
  const [dailyState,setDailyState]=useState({loading:true,question:null,answered:false,correct:false});
  const [showFeedback,setShowFeedback]=useState(false);
  const sessionEnterRef=useRef(null);

  const showToast=(msg,type='info')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const loadProfile=async(uid)=>{
    try{
      const {data}=await sb.from('profiles').select('*').eq('id',uid).single();
      if(data){
        const {data:rd}=await sb.from('ranking').select('position').eq('id',uid).single();
        setProfile({...data,ranking_pos:rd?.position||null});
        return data;
      }
    }catch(e){console.error(e);}
  };

  const loadDailyState=async(uid)=>{
    try{
      const today=todayBrasilia();
      // Get daily quiz count setting
      const {data:setting}=await sb.from('app_settings').select('value').eq('key','daily_quiz_count').single();
      const quizCount=parseInt(setting?.value||'1',10);
      // Get all scheduled slots for today (up to quizCount)
      const {data:slots}=await sb.from('daily_schedule')
        .select('slot,question_id,questions(*)')
        .eq('date',today)
        .lte('slot',quizCount)
        .order('slot',{ascending:true});
      if(!slots||slots.length===0){setDailyState({loading:false,question:null,answered:false,correct:false,quizCount,slot:1,totalSlots:0,answeredSlots:[]});return;}
      // Get which slots user already answered today
      const {data:answers}=await sb.from('daily_answers')
        .select('slot,is_correct,score')
        .eq('user_id',uid).eq('date',today);
      const answeredSlots=(answers||[]).map(a=>a.slot);
      // Find next unanswered slot
      const nextSlot=slots.find(s=>!answeredSlots.includes(s.slot));
      const allDone=!nextSlot;
      const lastAnswer=answers?.[answers.length-1];
      setDailyState({
        loading:false,
        question:nextSlot?.questions||null,
        slot:nextSlot?.slot||quizCount,
        answered:allDone,
        correct:lastAnswer?.is_correct||false,
        quizCount,
        totalSlots:slots.length,
        answeredSlots,
      });
    }catch(e){
      console.error(e);
      setDailyState({loading:false,question:null,answered:false,correct:false,quizCount:1,slot:1,totalSlots:0,answeredSlots:[]});
    }
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      if(session){loadProfile(session.user.id);loadDailyState(session.user.id);}
      setAuthLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setSession(session);
      if(session){loadProfile(session.user.id);loadDailyState(session.user.id);}
      else{setProfile(null);setDailyState({loading:false,question:null,answered:false,correct:false});}
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Track session time
  useEffect(()=>{
    if(!session)return;
    sessionEnterRef.current=Date.now();
    window.track('session_start',{});
    const onLeave=()=>{
      const dur=Math.round((Date.now()-sessionEnterRef.current)/1000);
      window.track('session_end',{duration_seconds:dur});
    };
    window.addEventListener('beforeunload',onLeave);
    return()=>window.removeEventListener('beforeunload',onLeave);
  },[session]);

  useEffect(()=>{localStorage.setItem('mq_scr',screen);},[screen]);

  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksVis(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksVis(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  const go=s=>setScreen(s);
  const handleLogout=async()=>{
    window.track('logout',{});
    await sb.auth.signOut();
    setSession(null);setProfile(null);setScreen('dashboard');
    showToast('Até logo! 👋');
  };

  if(authLoading)return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#003e52',gap:16}}>
      <div style={{width:56,height:56,borderRadius:18,background:'linear-gradient(135deg,#8dc63f,#0090C1)',display:'flex',alignItems:'center',justifyContent:'center',animation:'mqFloat 2s ease-in-out infinite'}}><IcZap s={26}/></div>
      <span className="spinner"/>
    </div>
  );

  if(!session)return(
    <>
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
      <LoginScreen onLogin={u=>{setSession({user:u});loadProfile(u.id);loadDailyState(u.id);go('dashboard');showToast('Bem-vindo ao Momento QUIZ! 🎉','success');}}/>
    </>
  );

  // Show micro-feedback after result
  if(showFeedback)return(
    <MicroFeedback session={session} date={todayBrasilia()} onDone={()=>{setShowFeedback(false);go('dashboard');showToast('Obrigado pelo feedback! 🙏','success');}}/>
  );

  const navScreens=['dashboard','history','ranking','profile','admin'];
  const isAdmin=profile?.is_admin||false;

  return(
    <div className="app-shell">
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
      <div className="app-main">
        {screen==='dashboard'&&<div className="page"><DashboardScreen go={go} session={session} profile={profile} dailyState={dailyState}/></div>}
        {screen==='quiz'&&<div className="page"><QuizScreen onFinish={r=>{setDailyResult(r);setDailyState(p=>({...p,answered:true,correct:r.correct}));loadProfile(session.user.id);go('result');}} session={session} dailyState={dailyState}/></div>}
        {screen==='result'&&<div className="page"><ResultScreen result={dailyResult} onHome={go} session={session} onFeedback={()=>setShowFeedback(true)}/></div>}
        {screen==='history'&&<div className="page"><HistoryScreen session={session}/></div>}
        {screen==='ranking'&&<div className="page"><RankingScreen session={session}/></div>}
        {screen==='profile'&&<div className="page"><ProfileScreen session={session} profile={profile} onLogout={handleLogout} go={go}/></div>}
        {screen==='settings'&&<div className="page"><SettingsScreen onLogout={handleLogout} go={go}/></div>}
        {screen==='admin'&&isAdmin&&<div className="page"><AdminScreen session={session}/></div>}
        {screen==='admin'&&!isAdmin&&<div className="page" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#002d3d',flexDirection:'column',gap:12,padding:24,textAlign:'center'}}><IcShield s={48} c="rgba(255,255,255,.2)"/><p style={{color:'rgba(255,255,255,.4)',fontSize:14}}>Acesso restrito.</p><button className="btn-ghost" style={{maxWidth:200}} onClick={()=>go('dashboard')}>← Voltar</button></div>}
      </div>
      {navScreens.includes(screen)&&<BNav cur={screen} go={go} isAdmin={isAdmin}/>}

      {tweaksVis&&(
        <div style={{position:'fixed',bottom:24,right:24,background:'#0e1c23',border:'1px solid rgba(255,255,255,.12)',borderRadius:16,padding:18,width:200,boxShadow:'0 24px 60px rgba(0,0,0,.6)',zIndex:9999,fontFamily:'Poppins',animation:'mqFadeUp .3s ease'}}>
          <div style={{fontWeight:800,fontSize:13,marginBottom:12,color:'#8dc63f'}}>⚙️ Tweaks</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,.4)',marginBottom:8}}>Navegar:</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
            {['dashboard','quiz','result','history','ranking','profile','admin','settings'].map(s=>(
              <button key={s} onClick={()=>go(s)} style={{background:screen===s?'rgba(141,198,63,.2)':'rgba(255,255,255,.06)',border:`1px solid ${screen===s?'#8dc63f':'transparent'}`,borderRadius:7,color:screen===s?'#8dc63f':'rgba(255,255,255,.5)',fontFamily:'Poppins',fontSize:9,fontWeight:700,padding:'5px 3px',cursor:'pointer',textTransform:'capitalize'}}>{s}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
